services:
  kairos-igreja:
    build: .
    container_name: kairos-igreja
    restart: unless-stopped
    ports:
      - "3012:3000"
    environment:
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:-kairos-secret-change-me}
      - APP_URL=${APP_URL:-http://187.77.229.227:3012}
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true