services:
  kairos-igreja:
    build: .
    container_name: kairos-igreja
    restart: unless-stopped
    ports:
      - "3012:3000"
    environment:
      - NODE_ENV=production
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - APP_URL=${APP_URL}
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true